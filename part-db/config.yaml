name: Part-DB
version: 2.14.0_2
slug: part_db
description: Part-DB electronic parts inventory, running the official partdborg/part-db image (https://github.com/Part-DB/Part-DB-server)
url: https://github.com/argaar/ha-part-db-app
arch:
  - amd64
  - aarch64
  - armv7
init: false
startup: application
boot: auto
host_network: false
hassio_api: false
ports:
  80/tcp: 8085
ports_description:
  80/tcp: Web UI
webui: http://[HOST]:[PORT:80]/
watchdog: tcp://[HOST]:[PORT:80]
ingress: true
ingress_port: 80
panel_title: Part-DB
panel_icon: mdi:chip
options:
  default_lang: en
  default_timezone: Europe/Rome
  base_currency: EUR
  instance_name: Part-DB
  allow_attachment_downloads: false
  max_attachment_file_size: 100M
  db_automigrate: true
  trusted_proxies: 172.30.32.0/23,127.0.0.0/8,::1
  trusted_hosts: ""
  database_url: ""
schema:
  default_lang: str
  default_timezone: str
  base_currency: str
  instance_name: str
  allow_attachment_downloads: bool
  max_attachment_file_size: str
  db_automigrate: bool
  trusted_proxies: str
  trusted_hosts: str?
  database_url: str?
