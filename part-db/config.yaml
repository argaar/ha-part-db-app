name: Part-DB
version: 2.14.0
slug: part_db
description: Part-DB electronic parts inventory, running the official partdborg/part-db image
url: https://github.com/Part-DB/Part-DB-server
arch:
  - amd64
  - aarch64
  - armv7
init: false
startup: application
boot: auto
host_network: false
hassio_api: false
ports:
  80/tcp: 8085
ports_description:
  80/tcp: Web UI
webui: http://[HOST]:[PORT:80]/
watchdog: tcp://[HOST]:[PORT:80]
options:
  default_lang: en
  default_timezone: Europe/Rome
  base_currency: EUR
  instance_name: Part-DB
  allow_attachment_downloads: false
  check_for_updates: true
  max_attachment_file_size: 100M
  db_automigrate: true
  trusted_proxies: 172.30.32.0/23,127.0.0.0/8,::1
  database_url: ""
schema:
  default_lang: str
  default_timezone: str
  base_currency: str
  instance_name: str
  allow_attachment_downloads: bool
  check_for_updates: bool
  max_attachment_file_size: str
  db_automigrate: bool
  trusted_proxies: str
  database_url: str?
